[project]
name = "qq-chat-robot-image-classifier"
version = "0.1.0"
description = "QQ群聊机器人 - 自动采集并分类二次元图片"
requires-python = ">=3.10"
dependencies = [
    "nonebot2[fastapi]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nb-cli>=1.7.4",
    "httpx>=0.28.0",
    "aiohttp>=3.9.0",
    "aiofiles>=25.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0.0",
]

[tool.nonebot]
# NoneBot2 配置
adapters = ["nonebot.adapters.onebot.v11"]
plugins = ["src.plugins.image_classifier", "src.plugins.watchdog"]
plugin_dirs = ["src/plugins"]
builtin_plugins = ["echo"]
